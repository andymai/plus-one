name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two runs at once would race on the same release PR and tag, so they queue. Cancelling one partway could leave a
# release PR that never gets auto-merge turned on.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # A PR opened with GITHUB_TOKEN never triggers CI, so the release PR could never pass its required checks.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_KUN_APP_ID }}
          private-key: ${{ secrets.RELEASE_KUN_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Auto-merge the release PR
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # fromJSON('') fails when the template is evaluated, even with the step skipped, so guard it.
          PR_NUMBER: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number }}
        # GitHub refuses --auto until the PR's required checks have registered, so retry for a minute.
        run: |
          for attempt in $(seq 1 6); do
            if gh pr merge "$PR_NUMBER" --auto --squash --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Couldn't turn on auto-merge for release PR #$PR_NUMBER."
          exit 1
