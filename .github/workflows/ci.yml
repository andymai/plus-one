name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python setup accepts, and the one .python-version installs.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run --frozen coverage run -m unittest discover -s tests
      - name: Coverage floor
        run: uv run --frozen coverage report
      - if: matrix.python == '3.14' && !cancelled()
        run: uv run --frozen coverage html
      - if: matrix.python == '3.14' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: htmlcov/
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen ruff check
      - name: Only plus1.web imports plus1.web
        run: uv run --frozen lint-imports
      - name: No dead code
        run: uv run --frozen vulture

  types:
    name: Types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen basedpyright

  lockfile:
    name: Lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - name: requirements.lock matches uv.lock
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements.txt --output-file requirements.lock -q
          git diff --exit-code requirements.lock
      # bin/ensure-venv installs requirements.lock with pip where uv isn't installed.
      - name: pip installs requirements.lock
        run: |
          uv venv -q "$RUNNER_TEMP/pip-venv" --seed
          "$RUNNER_TEMP/pip-venv/bin/python" -m pip install -q --disable-pip-version-check -r requirements.lock
          "$RUNNER_TEMP/pip-venv/bin/python" -c 'import jinja2, pywebpush, tomlkit'
      - name: bin/ensure-venv installs once, then only when the lock changes
        run: |
          bin/ensure-venv 2>&1 | tee first.log
          grep -q 'installing dependencies' first.log
          bin/ensure-venv 2>&1 | tee second.log
          test ! -s second.log
          echo '# changed' >> uv.lock
          bin/ensure-venv 2>&1 | tee changed.log
          grep -q 'installing dependencies' changed.log
          bin/ensure-venv 2>&1 | tee after.log
          test ! -s after.log
          git checkout uv.lock

  ci-pass:
    if: always()
    needs: [test, lint, types, lockfile]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: exit 1
