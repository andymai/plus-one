name: OSV Scan

# uv.lock pins every dependency, direct and transitive, so OSV scans it.
# Code scanning isn't available on this private repo, so results stay in the run
# log rather than uploading as SARIF. PRs are report-only; main and the weekly
# schedule fail on a known vulnerability.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scan:
    name: OSV Scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --lockfile=uv.lock
      upload-sarif: false
      fail-on-vuln: ${{ github.event_name != 'pull_request' }}
    permissions:
      actions: read
      contents: read
      security-events: write
