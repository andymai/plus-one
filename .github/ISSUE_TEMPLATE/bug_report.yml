name: Bug Report
description: Report a bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: A clear and concise description of what actually happened
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: bin/plus1 doctor
      description: Paste the output of `bin/plus1 doctor`, which checks that Plus One has everything it needs. Remove any GitHub login, repository, or local path details you prefer not to post publicly.
      render: text
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Information about your environment
      placeholder: |
        OS: [e.g. macOS 15.4, Fedora 44]
        Plus One version: [from bin/plus1 --version]
        Web app mode: [local or tailscale]
    validations:
      required: false
